<!doctype html>
<html lang="en">
  <head>
    <script>
      // Sandboxed iframe environment defense: intercept Vite HMR WebSocket and silence benign connection errors
      (function () {
        try {
          var OriginalWebSocket = window.WebSocket;
          if (OriginalWebSocket) {
            function ViteHmrMockSocket(url, protocols) {
              var isHmr = protocols === 'vite-hmr' ||
                (Array.isArray(protocols) && protocols.indexOf('vite-hmr') !== -1) ||
                (typeof url === 'string' && (url.indexOf(':24678') !== -1 || (url.indexOf('token=') !== -1 && url.indexOf('vite') !== -1)));

              if (isHmr) {
                var mock = {
                  readyState: 1, // OPEN
                  OPEN: 1,
                  CONNECTING: 0,
                  CLOSING: 2,
                  CLOSED: 3,
                  url: String(url),
                  protocol: 'vite-hmr',
                  extensions: '',
                  bufferedAmount: 0,
                  binaryType: 'blob',
                  onopen: null,
                  onclose: null,
                  onerror: null,
                  onmessage: null,
                  addEventListener: function (type, listener) {},
                  removeEventListener: function (type, listener) {},
                  dispatchEvent: function () { return true; },
                  send: function () {},
                  close: function () { this.readyState = 3; }
                };
                try { Object.setPrototypeOf(mock, OriginalWebSocket.prototype); } catch (e) {}
                return mock;
              }
              return Reflect.construct(OriginalWebSocket, arguments, ViteHmrMockSocket);
            }
            ViteHmrMockSocket.prototype = OriginalWebSocket.prototype;
            ViteHmrMockSocket.CONNECTING = OriginalWebSocket.CONNECTING;
            ViteHmrMockSocket.OPEN = OriginalWebSocket.OPEN;
            ViteHmrMockSocket.CLOSING = OriginalWebSocket.CLOSING;
            ViteHmrMockSocket.CLOSED = OriginalWebSocket.CLOSED;
            window.WebSocket = ViteHmrMockSocket;
          }

          // Filter out benign Vite websocket and auth popup dismissal errors from console output
          var origConsoleError = console.error;
          console.error = function () {
            var msg = Array.prototype.slice.call(arguments).join(' ');
            if (
              msg.indexOf('failed to connect to websocket') !== -1 ||
              msg.indexOf('WebSocket closed without opened') !== -1 ||
              msg.indexOf('popup-closed-by-user') !== -1 ||
              msg.indexOf('cancelled-popup-request') !== -1
            ) {
              return;
            }
            origConsoleError.apply(console, arguments);
          };

          var origConsoleWarn = console.warn;
          console.warn = function () {
            var msg = Array.prototype.slice.call(arguments).join(' ');
            if (msg.indexOf('websocket') !== -1 || msg.indexOf('WebSocket') !== -1) {
              return;
            }
            origConsoleWarn.apply(console, arguments);
          };

          // Catch unhandled promise rejections related to WebSocket and popup dismissals
          window.addEventListener('unhandledrejection', function (event) {
            var reason = event.reason ? (event.reason.message || String(event.reason)) : '';
            if (
              reason.indexOf('WebSocket') !== -1 ||
              reason.indexOf('websocket') !== -1 ||
              reason.indexOf('popup-closed-by-user') !== -1 ||
              reason.indexOf('cancelled-popup-request') !== -1
            ) {
              event.preventDefault();
            }
          });

          // Catch uncaught window errors related to WebSocket and popup dismissals
          window.addEventListener('error', function (event) {
            var message = event.message || '';
            if (
              message.indexOf('WebSocket') !== -1 ||
              message.indexOf('websocket') !== -1 ||
              message.indexOf('popup-closed-by-user') !== -1 ||
              message.indexOf('cancelled-popup-request') !== -1
            ) {
              event.preventDefault();
            }
          });
        } catch (err) {}
      })();
    </script>
